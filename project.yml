name: HouseholdHub
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    BUNDLE_ID_PREFIX: dev.householdhub
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HouseholdHub:
    type: application
    platform: iOS
    sources:
      - path: HouseholdHubApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        PRODUCT_NAME: HouseholdHub
        INFOPLIST_KEY_CFBundleDisplayName: Household Hub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HouseholdHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HouseholdHubTests
    dependencies:
      - target: HouseholdHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests

  HouseholdHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HouseholdHubUITests
    dependencies:
      - target: HouseholdHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        TEST_TARGET_NAME: HouseholdHub

schemes:
  HouseholdHub:
    build:
      targets:
        HouseholdHub: all
        HouseholdHubTests: [test]
        HouseholdHubUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - HouseholdHub
      targets:
        - HouseholdHubTests
        - HouseholdHubUITests
    run:
      config: Debug
    archive:
      config: Release

name: HouseholdHub
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    BUNDLE_ID_PREFIX: dev.householdhub
    # App Group shared with the widget (spec §5.2). Empty under the free Personal Team: the widget then shows its
    # fixture. Set to e.g. group.<team>.HouseholdHub (and add the entitlement) once a paid team exists.
    HH_APP_GROUP: ""
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HouseholdHubCore:
    type: framework
    platform: iOS
    sources:
      - path: HouseholdHubCore
      - path: Config/Privacy/Core/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).core
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES

  HouseholdHub:
    type: application
    platform: iOS
    sources:
      - path: HouseholdHubApp
      - path: Config/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: HouseholdHubCore
      - target: HouseholdHubWidget
    info:
      path: Config/HouseholdHub-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HHAppGroup: $(HH_APP_GROUP)
        # English and Spanish (Sprint 16); the String Catalogs hold the Spanish.
        CFBundleLocalizations: [en, es]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [householdhub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        PRODUCT_NAME: HouseholdHub
        INFOPLIST_KEY_CFBundleDisplayName: Household Hub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: Household Hub uses Face ID to lock your household's finances.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  HouseholdHubWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HouseholdHubWidget
      - path: Config/Privacy/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: HouseholdHubCore
        embed: false
    info:
      path: Config/HouseholdHubWidget-Info.plist
      properties:
        CFBundleDisplayName: Household Hub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HHAppGroup: $(HH_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.widget
        PRODUCT_NAME: HouseholdHubWidget
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  HouseholdHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HouseholdHubTests
    dependencies:
      - target: HouseholdHub
      - target: HouseholdHubCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tests

  HouseholdHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HouseholdHubUITests
    dependencies:
      - target: HouseholdHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        TEST_TARGET_NAME: HouseholdHub

schemes:
  HouseholdHub:
    build:
      targets:
        HouseholdHub: all
        HouseholdHubTests: [test]
        HouseholdHubUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - HouseholdHub
        - HouseholdHubCore
      targets:
        - HouseholdHubTests
        - HouseholdHubUITests
    run:
      config: Debug
    archive:
      config: Release

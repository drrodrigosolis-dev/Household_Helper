name: HouseholdHelper
options:
  bundleIdPrefix: com.householdhelper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HouseholdHelper:
    type: application
    platform: iOS
    sources:
      - path: Sources/HouseholdHelper
    resources:
      - path: Sources/HouseholdHelper/Resources
    info:
      path: Sources/HouseholdHelper/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.householdhelper.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - HouseholdHelperTests
      gatherCoverageData: true

  HouseholdHelperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HouseholdHelperTests
    dependencies:
      - target: HouseholdHelper
